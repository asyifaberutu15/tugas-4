        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:white;color:#9aa3f5}
        .navbar{background:#f8f9fa;border-bottom:1px solid #ddd}
        .navbar-container{display:flex;align-items:center;padding:8px 15px}
        .navbar-brand{font-size:20px;text-decoration:none;color:#222;margin-right:25px}
        .navbar-menu{display:flex;align-items:center;gap:5px;flex:1}

        .nav-link:hover{background:#e9ecef}
        .disabled{color:#aaa}
        .dropdown{position:relative}
        .dropdown-menu{display:none;position:absolute;top:100%;left:0;background:white;width:180px;padding:7px 0;border:1px solid #ddd;box-shadow:0 3px 8px #aaa}
        .dropdown-menu a{display:block;padding:8px 15px;text-decoration:none;color:#333}
        .dropdown-menu a:hover{background:#eee}
        .dropdown:hover .dropdown-menu{display:block}
        .navbar-button{display:flex;gap:8px}
        .button{padding:7px 14px;border-radius:5px;text-decoration:none}
        .daftar{border:1px solid #6799c2;color:#6788bb}
        .masuk{border:1px solid #95f5a5;color:#0b5e0f}
        .hero{padding:60px 8%}
        .hero-container{max-width:1200px;margin:auto;display:flex;align-items:center;gap:40px}
        .hero-text{width:60%}
        h1{font-family:Georgia;font-size:42px;margin-bottom:20px}
        .hero-text p{font-size:17px;line-height:1.7;margin-bottom:20px}
        .instagram{padding:9px 18px;border:1px solid #777;border-radius:6px;text-decoration:none;color:#555}
        .hero-image{width:40%;text-align:center}
        .hero-image img{width:300px;max-width:100%}
        .cards{padding:30px 8%}
        .card-container{max-width:1200px;margin:auto;display:flex;gap:30px}
        .card{width:50%;overflow:hidden;border-radius:12px;background:rgb(23, 144, 192);color:white}
        .card img{width:100%;height:330px;object-fit:cover;display:block}
        .card-content{padding:20px}
    </style>
</head>
